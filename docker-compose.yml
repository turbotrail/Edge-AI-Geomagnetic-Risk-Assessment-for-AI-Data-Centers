version: '3.8'

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=spacewx
      - DOCKER_INFLUXDB_INIT_BUCKET=realtime_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=your-influxdb-token-here
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: always



  ingestion:
    build: .
    container_name: noaa_ingestion
    command: python ingestion/noaa_swpc.py
    depends_on:
      - influxdb
    volumes:
      - .:/app
    restart: always

  magnetometer_ingestion:
    build: .
    container_name: magnetometer_ingestion
    command: python ingestion/magnetometer_ingestion.py
    depends_on:
      - influxdb
    volumes:
      - .:/app
    restart: always

  dashboard:
    build: .
    container_name: streamlit_dashboard
    command: streamlit run visualization/dashboard.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - influxdb
    volumes:
      - .:/app
    restart: always

volumes:
  influxdb_data:
